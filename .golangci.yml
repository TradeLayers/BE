version: "2"
linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - nilerr
    - revive
    - sqlclosecheck
  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
