version: "2"

linters:
  enable:
    # Correctness
    - errcheck
    - govet
    - staticcheck

    # Bug prevention
    - bodyclose
    - nilerr
    - sqlclosecheck

    # Code quality
    - unused
    - ineffassign
    - gosimple
    - gocritic

    # Style
    - revive

    # Security
    - gosec

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance

    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    paths:
      - vendor/
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
