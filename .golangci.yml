run:
  timeout: 5m

linters:
  enable:
    # Correctness
    - errcheck
    - govet
    - staticcheck

    # Bug prevention
    - bodyclose
    - nilerr
    - sqlclosecheck

    # Code quality
    - unused
    - ineffassign
    - gosimple
    - gocritic

    # Style
    - revive

    # Security
    - gosec

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - performance

  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck

  exclude-dirs:
    - vendor
